# CI backend SkinCheck (Laomera) — GitHub Actions.
# Dibuat 2026-11-13 untuk rubrik RPL (Testing & GitHub DevOps/CI-CD, 15%).
# Menjalankan unit test otomatis (pytest) di setiap push / pull request ke main.
# Tes di tests/ sengaja tidak menyentuh database, jadi CI hijau tanpa TiDB.
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q
